<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Output</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #stage { position: absolute; overflow: hidden; background: #000; }
      #stage canvas { position: absolute; left: 0; bottom: 0; display: block; }
      #overlay { pointer-events: none; }
      #hint {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        padding: 10px 18px; border-radius: 8px; background: rgba(0, 0, 0, 0.7);
        color: #fff; font: 16px system-ui, sans-serif; pointer-events: none;
        transition: opacity 0.4s;
      }
      #hint.hidden { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hint">Press F for full screen</div>
    <script type="module" src="/src/output/main.ts"></script>
  </body>
</html>
