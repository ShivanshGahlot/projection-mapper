<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1 id="app-name"></h1>
      </header>
      <section class="panel">
        <label class="control-label" for="shader-select">Shader</label>
        <select id="shader-select"></select>
        <button id="open-file" type="button">Open .fs file…</button>
        <input id="file-input" type="file" accept=".fs,.frag,.txt" hidden />
      </section>
      <section class="panel" id="global"></section>
      <section class="panel" id="controls"></section>
    </aside>
    <main id="stage">
      <canvas id="output"></canvas>
      <div id="fps"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
